name: Daily monitor

# Collects, builds the static dashboard, commits the data, and deploys Pages —
# all in one workflow. A push made with GITHUB_TOKEN does not trigger other
# workflows, so the deploy cannot live in a separate push-triggered job.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "site/**"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      review:
        description: "Run the private evidence reviewer after collection"
        required: false
        type: boolean
        default: false
      backfill:
        description: "Build the one-time three-year news and SEC baseline"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-monitor
  # Never interrupt a review or historical baseline halfway through.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Scheduled events keep the SHA that existed when they were queued.
          # Always begin from the latest published main branch instead.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Restore verified observatory state
        run: |
          if [ -f data/state/current.json ]; then
            asro state-restore --pointer data/state/current.json --database data/monitor.db
          elif git ls-files --error-unmatch data/monitor.db >/dev/null 2>&1; then
            echo "One-time release-asset bootstrap from the currently tracked public database."
          else
            echo "::error::No verified state pointer and no authorized bootstrap database."
            exit 1
          fi
      - name: Seed verified ownership and liability lineage
        run: asro seed-lineage
      - name: Rebuild derived measurements from reviewed source events
        run: asro rebuild-observations
      - name: Collect and extract
        if: inputs.backfill != true && !contains(github.event.head_commit.message, '[backfill]')
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
        run: asro run
      - name: Historical news and SEC baseline
        if: inputs.backfill == true || contains(github.event.head_commit.message, '[backfill]')
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
          ASRO_FRED_API_KEY: ${{ secrets.ASRO_FRED_API_KEY }}
        run: asro backfill --years 3 --news-limit 500 --sec-per-company 24
      - name: Daily evidence review and flagged repair
        if: github.event_name == 'push' || github.event.schedule == '17 10 * * *' || inputs.review || inputs.backfill
        # Review enriches provisional evidence but must never take the observatory offline.
        continue-on-error: true
        env:
          ASRO_OPENAI_API_KEY: ${{ secrets.ASRO_OPENAI_API_KEY }}
          ASRO_REVIEW_MODEL: ${{ vars.ASRO_REVIEW_MODEL || 'gpt-4.1-mini' }}
          REVIEW_LIMIT: ${{ (inputs.backfill == true || contains(github.event.head_commit.message, '[backfill]')) && 600 || 100 }}
          RETRY_FLAGGED_LIMIT: 700
        run: asro review --limit "$REVIEW_LIMIT" --retry-flagged-limit "$RETRY_FLAGGED_LIMIT" --batch-size 10
      - name: Daily authoritative acceptance queue audit
        if: github.event.schedule == '17 10 * * *' || inputs.review
        # Candidate queue failures are reported but cannot block the daily evidence site.
        # This command never promotes observations or changes accepted aggregates.
        continue-on-error: true
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
        run: >-
          asro acceptance-queue-run
          --manifest data/acceptance/current_ai_feature_family_batch3_inventory.json
          --acquired "$RUNNER_TEMP/asro-acceptance-queue"
          --output data/reports/current-ai-acceptance-queue.json
          --acquire
      - name: Acquire point-in-time control vintages
        # Without the secret the command exits 1 with an explanatory message; that must
        # not fail the whole scheduled run, it must leave the gate honestly blocking.
        continue-on-error: true
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
          ASRO_FRED_API_KEY: ${{ secrets.ASRO_FRED_API_KEY }}
        run: asro acquire-vintages --bootstrap

      - name: Package candidate immutable state
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/state-package" data/state
          if [ ! -f data/state/current.json ]; then
            # Bootstrap two distinct prior public Git states, oldest first, so
            # rollback protection exists before monitor.db leaves Git tracking.
            for ref in $(git log --format=%H -- data/monitor.db | sed -n '2,3p' | tac); do
              git show "$ref:data/monitor.db" > "$RUNNER_TEMP/prior.db"
              GITHUB_SHA="$ref" asro state-package \
                --database "$RUNNER_TEMP/prior.db" \
                --output "$RUNNER_TEMP/state-package" \
                --pointer data/state/current.json
              cp "$RUNNER_TEMP/state-package/current.json" data/state/current.json
            done
          fi
          asro state-package --database data/monitor.db --output "$RUNNER_TEMP/state-package" --pointer data/state/current.json
          cp "$RUNNER_TEMP/state-package/current.json" data/state/current.json
      - name: Build static site
        run: asro build-site
      - name: Validate usable release artifact
        run: |
          if ! release_output=$(asro release-check --max-age-hours 26 --state-pointer data/state/current.json 2>&1); then
            echo "$release_output"
            release_message=$(printf '%s\n' "$release_output" | tail -n 1)
            echo "::error title=Release artifact rejected::$release_message"
            exit 1
          fi
          echo "$release_output"
      - name: Publish immutable state assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view asro-state >/dev/null 2>&1 || \
            gh release create asro-state --title "ASRO durable public state" \
              --notes "Versioned, checksummed public SQLite state assets. See data/state/current.json."
          mkdir -p "$RUNNER_TEMP/state-existing"
          for asset in "$RUNNER_TEMP"/state-package/monitor-*; do
            name=$(basename "$asset")
            if gh release download asro-state --pattern "$name" --dir "$RUNNER_TEMP/state-existing" 2>/dev/null; then
              cmp "$asset" "$RUNNER_TEMP/state-existing/$name" || {
                echo "::error::Immutable release asset name collision: $name"
                exit 1
              }
            else
              gh release upload asro-state "$asset"
            fi
          done
      - name: Commit updated observatory data
        run: |
          git config user.name "asro-bot"
          git config user.email "asro-bot@users.noreply.github.com"
          git rm --cached --ignore-unmatch data/monitor.db
          git add data/ site/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily observatory update"
            # A source-only commit can land while collection is running. Replay
            # the generated data commit on top of it instead of rejecting the
            # monitor's push as non-fast-forward.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
