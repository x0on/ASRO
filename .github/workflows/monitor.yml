name: Hourly monitor

# Collects, builds the static dashboard, commits the data, and deploys Pages —
# all in one workflow. A push made with GITHUB_TOKEN does not trigger other
# workflows, so the deploy cannot live in a separate push-triggered job.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "site/**"
  schedule:
    - cron: "17 * * * *"
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      review:
        description: "Run the private evidence reviewer after collection"
        required: false
        type: boolean
        default: false
      backfill:
        description: "Build the one-time three-year news and SEC baseline"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-monitor
  # Never interrupt a review or historical baseline halfway through.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Seed verified ownership and liability lineage
        run: asro seed-lineage
      - name: Rebuild derived measurements from reviewed source events
        run: asro rebuild-observations
      - name: Collect and extract
        if: inputs.backfill != true && !contains(github.event.head_commit.message, '[backfill]')
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
        run: asro run
      - name: Historical news and SEC baseline
        if: inputs.backfill == true || contains(github.event.head_commit.message, '[backfill]')
        env:
          ASRO_SEC_USER_AGENT: ${{ secrets.ASRO_SEC_USER_AGENT }}
        run: asro backfill --years 3 --news-limit 500 --sec-per-company 24
      - name: Daily evidence review
        if: github.event_name == 'push' || github.event.schedule == '47 3 * * *' || inputs.review || inputs.backfill
        # Review enriches provisional evidence but must never take the observatory offline.
        continue-on-error: true
        env:
          ASRO_OPENAI_API_KEY: ${{ secrets.ASRO_OPENAI_API_KEY }}
          ASRO_REVIEW_MODEL: ${{ vars.ASRO_REVIEW_MODEL || 'gpt-4.1-mini' }}
          REVIEW_LIMIT: ${{ (inputs.backfill == true || contains(github.event.head_commit.message, '[backfill]')) && 600 || 100 }}
        run: asro review --limit "$REVIEW_LIMIT" --batch-size 10
      - name: Build static site
        run: asro build-site
      - name: Commit updated observatory data
        run: |
          git config user.name "asro-bot"
          git config user.email "asro-bot@users.noreply.github.com"
          git add data/ site/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: hourly observatory update"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
