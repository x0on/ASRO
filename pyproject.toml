[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-systemic-risk-observatory"
version = "0.2.0"
description = "Open-source monitoring and research toolkit for AI capital flows and systemic financial risk."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "AI Systemic Risk Observatory contributors"}
]
keywords = [
  "ai",
  "systemic-risk",
  "finance",
  "sec",
  "private-credit",
  "data-centers",
  "open-source"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-requests>=2.32",
]

[project.scripts]
asro = "asro.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/asro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["asro"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.coverage.run]
source = ["asro"]
branch = true
