episode_id = "housing-credit"
version = "3.0.0"
title = "Housing and structured-credit cycle"
stratum = "crisis"
period_start = 2004-01-01
period_end = 2010-12-31
availability_cutoff = 2011-01-31T00:00:00Z
entities = ["Lehman Brothers", "Bear Stearns", "Countrywide"]
controls = [
{series_id="policy_rate", version="1.0.0", unit="percent"},
{series_id="mortgage_rate", version="1.0.0", unit="percent"},
{series_id="unemployment_rate", version="1.0.0", unit="percent"},
]
features = [
{feature_key="capital_expenditure", feature_version="1.0.0"},
{feature_key="external_revenue", feature_version="1.0.0"},
{feature_key="external_cash_generation", feature_version="1.0.0"},
{feature_key="free_cash_flow", feature_version="1.0.0"},
{feature_key="capex_to_revenue", feature_version="1.0.0"},
{feature_key="debt_to_assets", feature_version="1.0.0"},
{feature_key="debt_to_operating_cash_flow", feature_version="1.0.0"},
{feature_key="resilient_liquidity_runway", feature_version="1.0.0"},
]
schema_version = "v2"
extractor_version = "1.0.0"
feature_set_version = "historical-benchmark-1.0.0"

[[source_plan]]
source_id = "primary-filings"
source_pattern = "SEC"
tier = "primary"
required = true

# Thresholds fixed before any coverage was measured. Feature coverage is allowed to fall
# short of one because a month can legitimately sit between filings; sources and controls
# are held near-complete because a gap there means the evidence is simply absent.
[coverage_gate]
minimum_entity_month_feature_coverage = 0.90
minimum_entity_source_coverage = 0.95
minimum_control_month_coverage = 0.95
